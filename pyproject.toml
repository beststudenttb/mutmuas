[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutmuas"
version = "0.1.0"
description = "Multi-terminal multi-agent system: distributed agents across machines over NATS JetStream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nats-py>=2.9",
    "PyYAML>=6",
    "mcp>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[project.scripts]
agentctl = "mutmuas.cli:agentctl"
agent-node = "mutmuas.cli:agent_node"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 120
