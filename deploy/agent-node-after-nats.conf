# Drop-in for the agent-node user unit on the machine that also runs NATS as a user service:
# start the node after the server, so its first connect does not race the server start-up.
#   mkdir -p ~/.config/systemd/user/mutmuas-agent-node.service.d
#   cp deploy/agent-node-after-nats.conf ~/.config/systemd/user/mutmuas-agent-node.service.d/after-nats.conf
#   systemctl --user daemon-reload
[Unit]
After=mutmuas-nats-server.service
Wants=mutmuas-nats-server.service
